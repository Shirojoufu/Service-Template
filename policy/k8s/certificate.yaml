# Self-signed is fine here: this webhook is only ever called by
# kube-apiserver inside the cluster, which trusts whatever CA bundle gets
# injected into the ValidatingWebhookConfiguration (see
# cert-manager.io/inject-ca-from below and validating-webhook.yaml) --
# nothing external needs to trust this CA.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: policy-webhook-selfsigned
  namespace: policy
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: policy-webhook-tls
  namespace: policy
spec:
  # Matches the Secret and mount path expected by policy/k8s/deployment.yaml
  # (/etc/webhook/certs/tls.crt, tls.key) and policy/Dockerfile's CMD.
  secretName: policy-webhook-tls
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d
  issuerRef:
    name: policy-webhook-selfsigned
    kind: Issuer
  dnsNames:
    - policy-webhook.policy.svc
    - policy-webhook.policy.svc.cluster.local
  usages:
    - server auth
