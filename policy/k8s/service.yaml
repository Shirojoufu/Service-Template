apiVersion: v1
kind: Service
metadata:
  name: policy-webhook
  namespace: policy
  labels:
    app: policy-webhook
spec:
  type: ClusterIP
  selector:
    app: policy-webhook
  ports:
    # kube-apiserver calls webhooks on 443 by default; forward to uvicorn's 8443.
    - name: https
      port: 443
      targetPort: https
