replicaCount: 2  # more than one, so a pod restart can't block every deploy

image:
  repository: paved-road-policy
  tag: dev
  pullPolicy: IfNotPresent

webhook:
  # See docs/adr/0003-webhook-failure-policy.md
  failurePolicy: Fail
  timeoutSeconds: 5
  # Never validated. The namespace this chart is installed into is always
  # added to this list, so the webhook can't block its own redeploy.
  excludedNamespaces:
    - kube-system
    - cert-manager
    - local-path-storage  # kind's storage provisioner

# The `team` label rule as a built-in CEL ValidatingAdmissionPolicy, kept
# alongside the webhook for comparison (docs/adr/0004-custom-webhook-vs-cel.md).
cel:
  enabled: true

certificate:
  duration: 2160h    # 90d
  renewBefore: 360h  # 15d

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
