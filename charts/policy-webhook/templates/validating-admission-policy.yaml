{{- if .Values.cel.enabled }}
# The webhook's `team` label rule as a built-in CEL policy. Runs inside the
# apiserver: no pod, Service, TLS cert or network hop.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ .Release.Name }}-require-team-label
  labels:
    {{- include "policy-webhook.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments"]
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: {{ include "policy-webhook.excludedNamespaces" . }}
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'team' in object.metadata.labels &&
        object.metadata.labels['team'] != ''
      message: "metadata.labels.team is required"
    - expression: >-
        has(object.spec.template.metadata.labels) &&
        'team' in object.spec.template.metadata.labels &&
        object.spec.template.metadata.labels['team'] != ''
      message: "spec.template.metadata.labels.team is required"
---
# A policy does nothing until it is bound.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ .Release.Name }}-require-team-label
  labels:
    {{- include "policy-webhook.labels" . | nindent 4 }}
spec:
  policyName: {{ .Release.Name }}-require-team-label
  validationActions: ["Deny"]
{{- end }}
