name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a push to the registry
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned by commit, not tag: astral-sh stopped publishing floating
      # major/minor tags from v8 onward specifically to prevent a tag being
      # repointed to a malicious commit (see the tj-actions 2025 incident).
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github

      - name: Test
        run: uv run pytest -v

  # Both images ship, so both get built and scanned the same way.
  build:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    strategy:
      matrix:
        include:
          - name: app
            dockerfile: Dockerfile
            image: paved-road-service
          - name: policy
            dockerfile: policy/Dockerfile
            image: paved-road-policy
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: ${{ matrix.image }}:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          # Separate cache scopes so the two images don't evict each other
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  scan:
    runs-on: ubuntu-24.04
    needs: build
    strategy:
      matrix:
        name: [app, policy]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/image.tar
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Installs the chart into a throwaway kind cluster and hits the running pod,
  # so a broken chart fails the PR instead of the next `make up`.
  deploy-test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: image-app
          path: ${{ runner.temp }}

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: paved-road

      - name: Load image into kind
        run: |
          docker load --input ${{ runner.temp }}/image.tar
          kind load docker-image paved-road-service:${{ github.sha }} --name paved-road

      - name: Lint chart
        run: helm lint charts/service

      - name: Install chart
        run: |
          helm install paved-road charts/service \
            --set image.repository=paved-road-service \
            --set image.tag=${{ github.sha }} \
            --wait --timeout 120s

      - name: Smoke test
        run: |
          kubectl port-forward svc/paved-road-service 8000:8000 &
          for _ in $(seq 1 15); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS localhost:8000/hello/ci

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe deployment paved-road-service

  # Installs the policy-webhook chart into kind and checks that bad
  # Deployments are rejected and good ones admitted. Uses the same make
  # targets as local development.
  policy-test:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: image-policy
          path: ${{ runner.temp }}

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: paved-road

      - name: Load image into kind
        run: |
          docker load --input ${{ runner.temp }}/image.tar
          kind load docker-image paved-road-policy:${{ github.sha }} --name paved-road

      - name: Lint chart
        run: helm lint charts/policy-webhook

      - name: Install cert-manager and the policy-webhook chart
        run: make policy-deploy TAG=${{ github.sha }}

      - name: Check policies are enforced
        run: make policy-test

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl describe deployment policy-webhook -n policy
          kubectl logs -n policy deployment/policy-webhook --tail=50

  # Pushes the exact images that were scanned and tested, not rebuilds.
  #
  # Declaring an environment makes GitHub record a Deployment, with its
  # success or failure, every time this runs. That's what DORA metrics tools
  # read. Each image gets its own environment so one merge isn't counted twice.
  push:
    runs-on: ubuntu-24.04
    needs: [scan, deploy-test, policy-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: app
            image: paved-road-service
            package: paved-road
            environment: production
          - name: policy
            image: paved-road-policy
            package: paved-road-policy
            environment: policy-webhook
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes to ghcr.io/<repo owner>/<package>, so a repo created from this
      # template publishes to its own owner with no edits. GHCR needs a
      # lowercase name, and owners can contain capitals.
      - name: Push image
        env:
          SOURCE: ${{ matrix.image }}:${{ github.sha }}
          PACKAGE: ${{ matrix.package }}
          SHA: ${{ github.sha }}
        run: |
          TARGET="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$PACKAGE:$SHA"
          docker load --input ${{ runner.temp }}/image.tar
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          echo "Pushed $TARGET" >> "$GITHUB_STEP_SUMMARY"
