replicaCount: 1

image:
  repository: paved-road-service
  tag: dev
  pullPolicy: IfNotPresent

# Every workload must carry a team label (enforced later by the
# admission policy in charts/policy-webhook/) so RBAC and ownership stay traceable.
team: team-a

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
